<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingresar · NexoRural</title>
  <meta name="description" content="NexoRural — Control de carga ganadera. AGO Soluciones.">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Roboto+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="login-page">

  <!-- Paisaje de fondo dibujado en SVG (sin imágenes externas) -->
  <div class="landscape" aria-hidden="true">
    <svg viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#5B6B7F"/>
          <stop offset=".45" stop-color="#B9C6CC"/>
          <stop offset=".75" stop-color="#EDE6D6"/>
        </linearGradient>
        <linearGradient id="h1" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#9DB36A"/><stop offset="1" stop-color="#6E8F3E"/>
        </linearGradient>
        <linearGradient id="h2" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#7DA142"/><stop offset="1" stop-color="#4E7A2A"/>
        </linearGradient>
        <linearGradient id="h3" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#5E8F2E"/><stop offset="1" stop-color="#2F5A1C"/>
        </linearGradient>
      </defs>
      <rect width="1440" height="900" fill="url(#sky)"/>
      <g fill="#fff" opacity=".35">
        <ellipse cx="260" cy="150" rx="220" ry="38"/>
        <ellipse cx="1120" cy="110" rx="260" ry="44"/>
        <ellipse cx="820" cy="210" rx="180" ry="26"/>
      </g>
      <path d="M0 520 C220 430 420 470 620 500 S1040 420 1440 470 V900 H0Z" fill="url(#h1)"/>
      <g fill="#2F4A22" opacity=".85">
        <ellipse cx="1180" cy="455" rx="120" ry="34"/>
        <ellipse cx="1320" cy="462" rx="90" ry="30"/>
        <circle cx="140" cy="500" r="16"/>
      </g>
      <path d="M0 610 C260 540 500 600 760 620 S1180 560 1440 590 V900 H0Z" fill="url(#h2)"/>
      <!-- alambrado -->
      <g stroke="#3B3325" stroke-width="3" opacity=".55">
        <line x1="0" y1="700" x2="1440" y2="660"/>
        <line x1="0" y1="718" x2="1440" y2="678"/>
        <line x1="120" y1="670" x2="120" y2="745"/>
        <line x1="420" y1="662" x2="420" y2="737"/>
        <line x1="720" y1="654" x2="720" y2="729"/>
        <line x1="1020" y1="646" x2="1020" y2="721"/>
        <line x1="1320" y1="638" x2="1320" y2="713"/>
      </g>
      <path d="M0 720 C300 680 640 740 960 730 S1300 690 1440 700 V900 H0Z" fill="url(#h3)"/>
    </svg>
  </div>

  <main class="login-wrap">
    <form class="glass-card" id="loginForm" novalidate>
      <div class="brand brand--light">
        <img src="assets/logo.svg" alt="" width="40" height="40">
        <div>
          <strong>NexoRural</strong>
          <span>Control de carga ganadera</span>
        </div>
      </div>

      <h1>Ingresar</h1>
      <p class="glass-sub">Bienvenido. Ingresá para registrar la carga del camión.</p>

      <label class="glass-field">
        <span class="sr-only">Usuario</span>
        <input type="text" id="usuario" name="usuario" placeholder="Usuario (capataz / encargado)" autocomplete="username" required>
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
      </label>

      <label class="glass-field">
        <span class="sr-only">Contraseña</span>
        <input type="password" id="clave" name="clave" placeholder="Contraseña" autocomplete="current-password" required>
        <button type="button" class="eye" id="verClave" aria-label="Mostrar contraseña">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </label>

      <label class="glass-check">
        <input type="checkbox" id="recordar" checked>
        <span>Recordarme en este equipo</span>
      </label>

      <p class="glass-error" id="loginError" role="alert" hidden></p>

      <button type="submit" class="glass-btn">Ingresar</button>

      <p class="glass-note">Versión 1 · acceso local sin base de datos.<br>Desarrollado por <strong>AGO Soluciones</strong></p>
    </form>
  </main>

  <script src="js/login.js"></script>
</body>
</html>
