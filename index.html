<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingresar · NexoRural</title>
  <meta name="description" content="NexoRural — Control de carga ganadera. AGO Soluciones.">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Roboto+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="login-page">

  <!-- Fondo: rodeo al atardecer -->
  <div class="landscape" aria-hidden="true"></div>

  <main class="login-wrap">
    <form class="glass-card" id="loginForm" novalidate>
      <div class="brand brand--light">
        <img src="assets/logo.svg" alt="" width="40" height="40">
        <div>
          <strong>NexoRural</strong>
          <span>Control de carga ganadera</span>
        </div>
      </div>

      <h1>Ingresar</h1>
      <p class="glass-sub">Bienvenido. Ingresá para registrar la carga del camión.</p>

      <label class="glass-field">
        <span class="sr-only">Usuario</span>
        <input type="text" id="usuario" name="usuario" placeholder="Usuario (capataz / encargado)" autocomplete="username" required>
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
      </label>

      <label class="glass-field">
        <span class="sr-only">Contraseña</span>
        <input type="password" id="clave" name="clave" placeholder="Contraseña" autocomplete="current-password" required>
        <button type="button" class="eye" id="verClave" aria-label="Mostrar contraseña">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </label>

      <label class="glass-check">
        <input type="checkbox" id="recordar" checked>
        <span>Recordarme en este equipo</span>
      </label>

      <p class="glass-error" id="loginError" role="alert" hidden></p>

      <button type="submit" class="glass-btn">Ingresar</button>

      <p class="glass-note">Versión 1 · acceso local sin base de datos.<br>Desarrollado por <strong>AGO Soluciones</strong></p>
    </form>
  </main>

  <script src="js/login.js"></script>
</body>
</html>
