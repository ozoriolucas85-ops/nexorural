<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="format-detection" content="telephone=no">
  <title>Ingresar · NexoRural</title>
  <meta name="description" content="NexoRural — Control de carga ganadera. AGO Soluciones.">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icono-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0F172A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="NexoRural">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/styles.css?v=4">
</head>
<body class="login-page">

  <!-- Fondo: rodeo al atardecer -->
  <div class="landscape" aria-hidden="true"></div>

  <main class="login-wrap">
    <form class="glass-card" id="loginForm" novalidate>
      <div class="brand brand--light">
        <img src="assets/logo.svg" alt="" width="40" height="40">
        <div>
          <strong>NexoRural</strong>
          <span>Control de carga ganadera</span>
        </div>
      </div>

      <h1 id="loginTitulo">Ingresar</h1>
      <p class="glass-sub" id="loginSub">Bienvenido. Ingresá para registrar la carga del camión.</p>
      <p class="glass-info" id="loginInfo" hidden></p>

      <label class="glass-field" id="campoNombre" hidden>
        <span class="sr-only">Nombre y apellido</span>
        <input type="text" id="nombre" name="nombre" placeholder="Nombre y apellido" autocomplete="name" maxlength="80">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M14 10h4M14 14h4M6 16c.5-1.5 1.6-2 3-2s2.5.5 3 2"/></svg>
      </label>

      <label class="glass-field">
        <span class="sr-only">Usuario</span>
        <input type="text" id="usuario" name="usuario" placeholder="Usuario (capataz / encargado)" autocomplete="username" required>
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
      </label>

      <label class="glass-field">
        <span class="sr-only">Contraseña</span>
        <input type="password" id="clave" name="clave" placeholder="Contraseña" autocomplete="current-password" required>
        <button type="button" class="eye" id="verClave" aria-label="Mostrar contraseña">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </label>

      <label class="glass-field" id="campoClave2" hidden>
        <span class="sr-only">Repetir contraseña</span>
        <input type="password" id="clave2" name="clave2" placeholder="Repetir contraseña" autocomplete="new-password">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      </label>

      <label class="glass-check" id="campoRecordar">
        <input type="checkbox" id="recordar" checked>
        <span>Recordarme en este equipo</span>
      </label>

      <p class="glass-error" id="loginError" role="alert" hidden></p>

      <button type="submit" class="glass-btn" id="btnIngresar">Ingresar</button>

      <p class="glass-note"><span id="loginModo">Conectando…</span><br>Desarrollado por <strong>AGO Soluciones</strong></p>
    </form>
  </main>

  <script src="js/logic.js"></script>
  <script src="js/store.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
