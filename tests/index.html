<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Casos de prueba · NexoRural</title>
  <link rel="icon" href="../assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/fonts.css">
  <style>
    body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; background: #F8FAFC; color: #0F172A; margin: 0; padding: 40px 20px; }
    main { max-width: 860px; margin: 0 auto; }
    h1 { margin: 0 0 4px; font-size: 1.8rem; }
    p { color: #64748B; margin: 0 0 24px; }
    .total { font-family: 'Roboto Mono', monospace; font-size: 1.1rem; font-weight: 600; padding: 14px 18px; border-radius: 12px; margin-bottom: 18px; }
    .total.ok { background: #ECFDF5; color: #047857; }
    .total.fail { background: #FEF2F2; color: #DC2626; }
    ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
    li { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; background: #fff; border: 1px solid #E2E8F0; border-radius: 12px; }
    .b { flex: none; font-family: 'Roboto Mono', monospace; font-size: .8rem; font-weight: 600; padding: 3px 8px; border-radius: 6px; }
    .b.ok { background: #059669; color: #fff; }
    .b.fail { background: #DC2626; color: #fff; }
    a { color: #059669; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <h1>Casos de prueba</h1>
    <p>Sección 12 y criterios de aceptación del análisis. Se ejecutan sobre <code>js/logic.js</code>. · <a href="../panel.html">Volver al panel</a></p>
    <div class="total" id="total"></div>
    <ul id="lista"></ul>
  </main>
  <script src="../js/logic.js"></script>
  <script src="casos.js"></script>
  <script>
    var res = NexoCasos.ejecutar();
    var ok = res.filter(function (r) { return r.ok; }).length;
    var total = document.getElementById('total');
    total.textContent = ok + ' / ' + res.length + ' casos superados';
    total.className = 'total ' + (ok === res.length ? 'ok' : 'fail');
    document.getElementById('lista').innerHTML = res.map(function (r) {
      return '<li><span class="b ' + (r.ok ? 'ok">OK' : 'fail">FALLA') + '</span><span>' + r.nombre +
        (r.error ? ' — ' + r.error : '') + '</span></li>';
    }).join('');
  </script>
</body>
</html>
